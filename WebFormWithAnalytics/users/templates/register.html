{% load static %} 
<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{% static 'register_style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>Finance Manager by RL</title>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class = "MainBlock">
        <h1>Finance Manager by RL</h1>
        <h2>REGISTRATION</h2>
        <form action="{% url 'register' %}" method="POST">
            {% csrf_token %}
            <input type="text" name="first_name" placeholder="First name" min="1">
            <input type="text" name="last_name" placeholder="Last name" min="1">
            <input type="text" name="email" placeholder="Email" min="1">
            <input type="text" name="user_login" placeholder="Login" min="1">
            <input type="password" name="user_password" placeholder="Password" min="1">
            <input type="password" name="password_confirmation" placeholder="Password confirmation" min="1">
            {% if messages %}
            <div class="Error">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            <div class = "ButtonBlock">
                <button type="submit" name="action" value="register">Register</button>
            </div>
        </form>
    </div>
</body>
</html>
